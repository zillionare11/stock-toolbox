<html lang="zh-CN" data-trae-theme="light"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资工具箱 · A股评分与金融早报</title>
<style>
:root{
  --bg:#f0f2f7; --card:#ffffff; --text:#1b2437; --text2:#68748b;
  --border:#e6e9f0; --primary:#4263eb; --p-light:#667eea; --p-dark:#764ba2;
  --green:#0ca678; --green-l:#40c057; --yellow:#fab005; --orange:#fd7e14; --red:#fa5252;
  --shadow:0 2px 14px rgba(30,41,82,.07); --shadow-h:0 8px 28px rgba(30,41,82,.12);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(1200px 500px at 20% -10%,rgba(102,126,234,.08),transparent),
                   radial-gradient(1000px 400px at 90% -10%,rgba(118,75,162,.07),transparent);
}

/* ===== Tab Navigation ===== */
.nav-bar{
  position:sticky;top:0;z-index:100;height:52px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;justify-content:center;align-items:center;gap:4px;padding:0 16px;
}
.nav-tab{
  background:none;border:none;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--text2);
  padding:10px 24px;position:relative;transition:color .2s;
  font-family:inherit;
}
.nav-tab:hover{color:var(--primary)}
.nav-tab.active{color:var(--primary)}
.nav-tab.active::after{
  content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--p-dark));border-radius:3px 3px 0 0;
}

/* ===== Pages ===== */
.page{display:none}
.page.active{display:block}
.page-iframe{width:100%;height:calc(100vh - 52px);border:none;display:block}

/* ===== Briefing Page ===== */
.briefing-container{max-width:1180px;margin:0 auto;padding:28px 20px 48px}

.briefing-header{text-align:center;margin-bottom:28px}
.briefing-title{
  font-size:28px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(120deg,#4263eb,#764ba2 55%,#e64980);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:inline-block;
}
.briefing-date-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.briefing-date-text{color:var(--text2);font-size:14px}
.briefing-refresh-btn{
  background:linear-gradient(120deg,var(--p-light),var(--p-dark));color:#fff;border:none;
  border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer;font-weight:600;
  transition:transform .15s,box-shadow .15s;font-family:inherit;
}
.briefing-refresh-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(102,126,234,.4)}
.briefing-refresh-btn:disabled{opacity:.5;cursor:wait;transform:none}

.briefing-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px;margin-bottom:20px;
}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px}

/* Index Grid */
.index-group-label{
  font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 8px;padding-left:2px;
}
.index-group-label:first-child{margin-top:0}
.index-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;
}
.index-card{
  background:#f8f9fc;border-radius:12px;padding:14px 16px;
  transition:transform .15s,box-shadow .15s;
}
.index-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.index-card .idx-name{font-size:13px;font-weight:600;color:var(--text2)}
.index-card .idx-price{font-size:22px;font-weight:800;font-family:Menlo,monospace;margin:4px 0 2px}
.index-card .idx-chg{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.idx-up{color:var(--red)}
.idx-down{color:var(--green)}
.idx-flat{color:var(--text2)}

/* News */
.news-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.news-filter{display:flex;gap:6px}
.filter-btn{
  background:#f1f3f5;border:none;border-radius:8px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;
  font-family:inherit;
}
.filter-btn:hover{background:#e9ecef}
.filter-btn.active{background:linear-gradient(135deg,var(--primary),var(--p-dark));color:#fff}

.news-list{max-height:760px;overflow-y:auto}
.news-list::-webkit-scrollbar{width:6px}
.news-list::-webkit-scrollbar-track{background:transparent}
.news-list::-webkit-scrollbar-thumb{background:#dbe0ea;border-radius:3px}
.news-item{
  display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f3f5f9;
}
.news-item:last-child{border-bottom:none}
.news-time{
  flex:0 0 52px;font-size:13px;font-weight:700;color:var(--primary);
  font-family:Menlo,monospace;padding-top:2px;
}
.news-content{flex:1;min-width:0}
.news-title{font-size:14.5px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:4px}
.news-text{font-size:13px;color:var(--text2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-tag{
  display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;
  margin-left:6px;vertical-align:middle;
}
.news-tag.tech{background:rgba(66,99,235,.12);color:var(--primary)}
.news-tag.finance{background:rgba(12,166,120,.12);color:var(--green)}
.news-tag.bullish{background:rgba(250,82,82,.12);color:var(--red)}
.news-tag.bearish{background:rgba(12,166,120,.12);color:var(--green)}
.news-title-row{display:flex;align-items:center;gap:8px}
.news-refresh-btn{
  background:#f1f3f5;border:none;border-radius:8px;width:30px;height:30px;
  font-size:14px;cursor:pointer;transition:all .15s;line-height:1;
}
.news-refresh-btn:hover{background:#e9ecef;transform:rotate(180deg)}
.news-refresh-btn:disabled{opacity:.5;cursor:wait}

.briefing-loading{
  text-align:center;padding:30px 20px;color:var(--text2);font-size:14px;
}
.briefing-footer{text-align:center;color:#9aa4bb;font-size:12px;margin-top:28px;line-height:1.8}

.briefing-spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid #dbe0ea;border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:560px){
  .index-grid{grid-template-columns:1fr 1fr}
  .news-time{flex:0 0 42px;font-size:12px}
  .nav-tab{font-size:13px;padding:10px 14px}
  .briefing-title{font-size:24px}
}
</style>

  if(!res.ok) throw new Error('HTTP ' + res.status);
  if(enc === 'gbk'){
    const buf = await res.arrayBuffer();
    return new TextDecoder('gbk').decode(buf);
  }
  return await res.text();
}

function jsonp(url, cbParam){
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2,9);
    const sep = url.includes('?') ? '&' : '?';
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if(!settled){ settled = true; cleanup(); reject(new Error('请求超时')); }
    }, 12000);
    window[cbName] = data => {
      if(!settled){ settled = true; cleanup(); resolve(data); }
    };
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    script.onload = () => {
      setTimeout(() => {
        if(!settled && window[cbName]){
          settled = true; cleanup(); reject(new Error('接口返回格式异常'));
        }
      }, 50);
    };
    script.onerror = () => {
      if(!settled){ settled = true; cleanup(); reject(new Error('网络请求失败')); }
    };
    script.src = url + sep + encodeURIComponent(cbParam) + '=' + cbName;
    document.body.appendChild(script);
  });
}

async function emJson(url){
  let lastErr = null;
  for(const param of ['cb','callback']){
    try{ return await jsonp(url, param); }
    catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('请求失败');
}

let briefTimer = null;
function scheduleBriefRefresh(){
  if(briefTimer){ clearTimeout(briefTimer); briefTimer = null; }
  const now = new Date();
  const next = new Date(now);
  next.setHours(16, 0, 0, 0);
  if(now >= next) next.setDate(next.getDate() + 1);
  while(next.getDay() === 0 || next.getDay() === 6) next.setDate(next.getDate() + 1);
  briefTimer = setTimeout(() => {
    const f = $('briefIframe');
    if(f){ const s = f.src; f.src = ''; f.src = s; }
    scheduleBriefRefresh();
  }, next - now);
}

  '云计算','5G','6G','光伏','新能源','电池','锂电','储能','量子','区块链','数字货币',
  '元宇宙','机器人','自动驾驶','光刻','封装','数据中心','服务器','GPU','CPU',

const FINANCE_KEYWORDS = ['央行','利率','LPR','降准','降息','加息','回购','国债','逆回购',
  'MLF','股市','基金','期货','外汇','银行','券商','保险','信托','上市','增发','减持',
  '监管','证监会','银保监','金融','财政','税收','关税','GDP','CPI','PPI','PMI',
  '社融','M2','汇率','人民币','美元','美股','A股','港股','北向','南向','两融','退市','重组','并购'];

function classifyNews(text){
  const t = text.toLowerCase();
  const isTech = TECH_KEYWORDS.some(k => t.includes(k.toLowerCase()));
  const isFinance = FINANCE_KEYWORDS.some(k => t.includes(k.toLowerCase()));

}

/* ===== 行业 × 利好/利空 识别 ===== */
const SECTOR_MAP = {
  '半导体': ['芯片','半导体','光刻','封装','集成电路','晶圆','存储','PCB','CPO','覆铜板','光模块'],
  '新能源': ['光伏','锂电','锂电池','储能','充电桩','氢能','风电','新能源','电池','宁德'],
  '医药': ['医药','医疗','疫苗','创新药','中药','生物','制药','器械','药品'],
  '银行': ['银行','信贷','存款','贷款','息差'],
  '券商': ['券商','证券','交易所','投行'],
  '地产': ['房地产','楼市','住房','地产','土地'],
  '军工': ['军工','国防','航天','航空','导弹','军品'],
  '白酒': ['白酒','茅台','五粮液','酒类'],
  'AI/算力': ['AI','人工智能','大模型','算力','GPU','Sora','GPT','OpenAI','数据中心','服务器','CPO'],
  '汽车': ['汽车','新能源车','比亚迪','特斯拉','智能驾驶','自动驾驶','整车'],
  '农业': ['农业','种子','化肥','粮食','猪肉','养殖'],
  '黄金': ['黄金','贵金属','金矿','有色'],
  '电力': ['电力','电网','特高压','发电'],
  '石油': ['石油','原油','油气','石化','化工'],
  '消费电子': ['苹果','手机','面板','消费电子','可穿戴'],
};

const BULLISH_KW = ['涨停','大涨','暴涨','飙升','增长','超预期','利好','突破','新高','暴增','翻倍','大增','走强','拉升','创新高','加仓','买入','回购','增持','订单','中标','获批','量产','爆发','放量','净流入','大单','强势','回暖','复苏','超增','超预期'];
const BEARISH_KW = ['跌停','大跌','暴跌','下滑','亏损','利空','破位','新低','大减','腰斩','走弱','下挫','重挫','减持','清仓','退市','爆雷','违约','下调','警示','问询','承压','萎缩','负增长','下降','低迷','疲软','压力','风险'];

function analyzeSentiment(text){
  const t = text.toLowerCase();
  let bull = 0, bear = 0;
  BULLISH_KW.forEach(k => { if(t.includes(k.toLowerCase())) bull++; });
  BEARISH_KW.forEach(k => { if(t.includes(k.toLowerCase())) bear++; });
  if(bull === 0 && bear === 0) return null;
  if(bull === bear) return null;
  const direction = bull > bear ? '利好' : '利空';
  const sectors = [];
  for(const [s, kws] of Object.entries(SECTOR_MAP)){
    if(kws.some(k => t.includes(k.toLowerCase()))) sectors.push(s);
  }
  if(!sectors.length) return null;
  return { direction, sectors: sectors.slice(0, 2) };
}

/* ===== Market Indices ===== */
async function loadIndices(){
  try{
    const codes = 'sh000001,sz399001,sz399006,sh000688,hkHSI,hkHSTECH,usDJI,usIXIC,usSPX';
    const url = 'https://qt.gtimg.cn/q=' + codes;
    const text = await new Promise((resolve, reject) => {
      const varName = 'v_sh000001';
      try { delete window[varName]; } catch(e) { window[varName] = undefined; }
      const script = document.createElement('script');
      let settled = false;
      const timer = setTimeout(() => {
        if(!settled){ settled = true; cleanup(); reject(new Error('指数行情超时')); }
      }, 12000);
      function cleanup(){
        clearTimeout(timer);
        if(script.parentNode) script.parentNode.removeChild(script);
      }
      script.onload = () => {
        if(!settled){
          settled = true; cleanup();
          // 收集所有 v_ 变量
          const lines = codes.split(',').map(c => {
            const vn = 'v_' + c;
            const val = window[vn];
            try { delete window[vn]; } catch(e) { window[vn] = undefined; }
            if(typeof val === 'string' && val.length > 5) return 'v_' + c + '="' + val + '";';
            return '';
          }).filter(l => l);
          resolve(lines.join('\n'));
        }
      };
      script.onerror = () => {
        if(!settled){ settled = true; cleanup(); reject(new Error('指数网络请求失败')); }
      };
      script.src = url;
      document.body.appendChild(script);
    });
    const lines = text.trim().split(';').filter(l => l.trim());
    const indices = lines.map(line => {
      const m = line.match(/v_(\w+)="([^"]+)"/);
      if(!m) return null;
      const f = m[2].split('~');
      const chgPct = +f[32];
      const chg = +f[31];
      return {
        code: m[1],
        name: f[1] || m[1],
        price: +f[3],
        prevClose: +f[4],
        chgPct: isNaN(chgPct) ? 0 : chgPct,
        chg: isNaN(chg) ? 0 : chg
      };
    }).filter(Boolean);
    renderIndices(indices);
  }catch(e){
    $('indexGrid').innerHTML = '<div class="briefing-loading">市场数据加载失败，请点击刷新重试</div>';
  }
}

function renderIndices(indices){
  const groups = [
    { label:'A 股', codes:['sh000001','sz399001','sz399006','sh000688'] },
    { label:'港 股', codes:['hkHSI','hkHSTECH'] },
    { label:'美 股', codes:['usDJI','usIXIC','usSPX'] }
  ];
  let html = '';
  groups.forEach(g => {
    const items = indices.filter(i => g.codes.includes(i.code));
    if(!items.length) return;
    html += '<div class="index-group-label">' + g.label + '</div>';
    html += '<div class="index-grid">';
    items.forEach(idx => {
      const up = idx.chgPct > 0, down = idx.chgPct < 0;
      const cls = up ? 'idx-up' : down ? 'idx-down' : 'idx-flat';
      const arrow = up ? '▲' : down ? '▼' : '—';
      html += '<div class="index-card">' +
        '<div class="idx-name">' + idx.name + '</div>' +
        '<div class="idx-price ' + cls + '">' + fmt(idx.price, 2) + '</div>' +
        '<div class="idx-chg ' + cls + '">' + arrow + ' ' +
          (up ? '+' : '') + fmt(idx.chgPct, 2) + '%</div>' +
      '</div>';
    });
    html += '</div>';
  });
  $('indexGrid').innerHTML = html || '<div class="briefing-loading">暂无数据</div>';
}

/* ===== 7×24 News ===== */
function loadNewsScript(url){
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if(!settled){ settled = true; cleanup(); reject(new Error('请求超时')); }
    }, 12000);
    function cleanup(){
      clearTimeout(timer);
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window.ajaxResult; }catch(e){ window.ajaxResult = undefined; }
    }
    script.onload = () => {
      setTimeout(() => {
        if(!settled){
          if(window.ajaxResult){ settled = true; const d = window.ajaxResult; cleanup(); resolve(d); }
          else{ settled = true; cleanup(); reject(new Error('接口返回格式异常')); }
        }
      }, 50);
    };
    script.onerror = () => {
      if(!settled){ settled = true; cleanup(); reject(new Error('网络请求失败')); }
    };
    script.src = url;
    document.body.appendChild(script);
  });
}

async function loadNews(){
  try{
    const url = 'https://newsapi.eastmoney.com/kuaixun/v1/getlist_101_ajaxResult_80_1_.html';
    const data = await loadNewsScript(url);
    const list = data.LivesList || [];
    allNews = list.map(item => {
      const title = item.title || '';
      const content = item.digest || '';
      const time = item.showtime || '';
      const timeStr = time ? time.slice(11, 16) : '';
      const fullText = title + ' ' + content;
      const cat = classifyNews(fullText);
      const sent = analyzeSentiment(fullText);
      return { title, content, timeStr, fullTime: time, tech: cat.tech, finance: cat.finance, sentiment: sent };
    }).filter(n => n.title);
    renderNews(allNews);
  }catch(e){
    $('newsList').innerHTML = '<div class="briefing-loading">快讯加载失败，请点击刷新重试</div>';
  }
}

function renderNews(news){
  let filtered = news;
  if(currentFilter === 'tech') filtered = news.filter(n => n.tech);
  else if(currentFilter === 'finance') filtered = news.filter(n => n.finance);
  else if(currentFilter === 'bullish') filtered = news.filter(n => n.sentiment && n.sentiment.direction === '利好');
  else if(currentFilter === 'bearish') filtered = news.filter(n => n.sentiment && n.sentiment.direction === '利空');

  if(!filtered.length){
    $('newsList').innerHTML = '<div class="briefing-loading">暂无相关快讯</div>';
    return;
  }
  $('newsList').innerHTML = filtered.slice(0, 80).map(n => {
    let tags = '';
    if(n.sentiment){
      const cls = n.sentiment.direction === '利好' ? 'bullish' : 'bearish';
      n.sentiment.sectors.forEach(s => {
        tags += '<span class="news-tag ' + cls + '">' + n.sentiment.direction + ' ' + s + '</span>';
      });
    }
    if(n.tech) tags += '<span class="news-tag tech">科技</span>';
    if(n.finance) tags += '<span class="news-tag finance">金融</span>';
    return '<div class="news-item">' +
      '<div class="news-time">' + n.timeStr + '</div>' +
      '<div class="news-content">' +
        '<div class="news-title">' + n.title + tags + '</div>' +
        '<div class="news-text">' + n.content + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}
